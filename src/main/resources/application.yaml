spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/spin
    username: root
    password: "1234"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-5

app:
  # QR 딥링크에 쓰는 앱 커스텀 URL 스킴 (예: spin://checkin?code=...)
  deep-link-scheme: spin
