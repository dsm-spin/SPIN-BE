spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/spin
    username: root
    password: "1234"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-opus-4-8

app:
  deep-link-scheme: spin
  # 데모 기간 임시 설정: true면 QR 값과 무관하게 아무 QR이나 찍으면 체크인된다.
  # 실사용 전환 시 false로 되돌릴 것.
  demo-checkin-enabled: true
